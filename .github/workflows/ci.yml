name: CI
on:
  push:
    branches: [main, 'feat/release-automation']
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
permissions:
  contents: read
jobs:
  labels:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Require release classification
        env:
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          python - <<'PY'
          import json, os
          labels = set(json.loads(os.environ['PR_LABELS']))
          assert len(labels & {'release:major', 'release:minor', 'release:patch'}) == 1, 'Choose exactly one release:major/minor/patch label'
          assert len(labels & {'feature', 'bug', 'documentation', 'maintenance'}) == 1, 'Choose exactly one feature/bug/documentation/maintenance label'
          PY
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r tools/requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q FusionFreeDeburr tools
      - run: python tools/make_icons.py
      - run: python tools/package.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installation-${{ matrix.os }}
          path: dist/*.zip
          if-no-files-found: error
