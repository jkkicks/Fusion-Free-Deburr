name: Build release
# Nightly: runs on a schedule and publishes a prerelease when main has changed.
# Stable: run by hand with channel "stable"; it waits for approval on the
# protected "release" environment. See docs/releases.md.
on:
  schedule:
    - cron: '23 10 * * *' # 10:23 UTC, about 2:23 AM Pacific
  workflow_dispatch:
    inputs:
      channel:
        description: 'stable = next full release (needs approval); nightly = a test build now'
        required: true
        type: choice
        options: [stable, nightly]
        default: stable
      source_sha:
        description: 'Optional: full 40-character commit SHA on main to release. Empty = latest main.'
        required: false
        type: string
      version:
        description: 'Optional, stable only: version without v (e.g. 1.0.0). Empty = worked out from PR labels.'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: release-publication
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    # Scheduled runs have no inputs, so they always take the nightly path.
    environment: ${{ inputs.channel == 'stable' && 'release' || 'nightly' }}
    permissions:
      contents: write
      pull-requests: read
      actions: read
    runs-on: ubuntu-latest
    env:
      RELEASE_CHANNEL: ${{ inputs.channel || 'nightly' }}
      REQUESTED_SHA: ${{ inputs.source_sha }}
      REQUESTED_VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Choose source
        shell: bash
        run: |
          set -euo pipefail
          sha="${REQUESTED_SHA:-$(git rev-parse origin/main)}"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$sha" origin/main
          test "$(git rev-parse "$sha^{commit}")" = "$sha"
          if [[ -n "$REQUESTED_VERSION" && "$RELEASE_CHANNEL" != stable ]]; then
            echo "::error::A version override is only allowed for stable releases"
            exit 1
          fi
          git checkout --detach "$sha"
          echo "SOURCE_SHA=$sha" >> "$GITHUB_ENV"
      - name: Require passing main CI
        shell: bash
        run: |
          set -euo pipefail
          count="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SOURCE_SHA&event=push&status=success" --jq '.total_count')"
          if [[ "$count" == 0 ]]; then
            echo "::error::CI has not passed on main for $SOURCE_SHA"
            exit 1
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Skip a source that is already released
        id: candidate
        run: python tools/release.py --check-source
      - name: Prepare the draft
        if: steps.candidate.outputs.proceed == 'true'
        id: draft
        uses: release-drafter/release-drafter@7cf306f56b79636bb76931494ccf29fc893763bd # v6.1.0
        with:
          config-name: ${{ env.RELEASE_CHANNEL == 'stable' && 'release-drafter-stable.yml' || 'release-drafter.yml' }}
          publish: false
          disable-autolabeler: true
          commitish: ${{ env.SOURCE_SHA }}
          version: ${{ env.REQUESTED_VERSION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: python -m pip install -r tools/requirements-build.txt
        if: steps.candidate.outputs.proceed == 'true'
      - run: python -m unittest discover -s tests -v
        if: steps.candidate.outputs.proceed == 'true'
      - run: python -m compileall -q FusionFreeDeburr tools
        if: steps.candidate.outputs.proceed == 'true'
      - run: python tools/make_icons.py
        if: steps.candidate.outputs.proceed == 'true'
      - name: Build, verify, and publish
        if: steps.candidate.outputs.proceed == 'true'
        run: python tools/release.py
        env:
          RELEASE_VERSION: ${{ steps.draft.outputs.tag_name }}
          PUBLISH_RELEASE: 'true'
