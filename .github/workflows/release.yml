name: Build release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact SemVer without v (e.g. 0.2.0-alpha.1); must match the reviewed draft tag'
        required: true
        type: string
      source_sha:
        description: 'Full 40-character commit SHA on main that was tested in Fusion'
        required: true
        type: string
      publish:
        description: 'Publish after verifying assets (false leaves a draft for review)'
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: release-publication
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    environment: release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate source
        shell: bash
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          test "$(git rev-parse "$SOURCE_SHA^{commit}")" = "$SOURCE_SHA"
          git checkout --detach "$SOURCE_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r tools/requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q FusionFreeDeburr tools
      - run: python tools/make_icons.py
      - name: Build and verify draft assets
        run: python tools/release.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_RELEASE: ${{ inputs.publish }}
